dispatch:
  # Route the new public domain to the default App Engine service.
  - url: "img-man.com/*"
    service: default
  - url: "www.img-man.com/*"
    service: default
  - url: "im.icogenx.com/*"
    service: default
  - url: "icogenx.com/*"
    service: online-games
  - url: "www.icogenx.com/*"
    service: online-games
  - url: "api.icogenx.com/*"
    service: backend
  